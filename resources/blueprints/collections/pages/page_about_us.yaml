title: 'Pagina - Over ons'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: subtitel_tekst
            field:
              type: text
              display: 'Subtitel tekst'
          -
            handle: title
            field:
              type: text
              required: true
              width: 50
              validate:
                - required
              display: 'Titel pagina'
          -
            handle: over_ons_tekst
            field:
              remove_empty_nodes: false
              type: bard
              display: 'Over ons tekst'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: parent
            field:
              type: entries
              collections:
                - pages
              max_items: 1
              listable: false
              localizable: true
