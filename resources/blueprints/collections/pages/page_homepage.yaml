title: page_homepage
tabs:
  main:
    display: Main
    sections:
      -
        display: Hero
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              width: 50
              validate:
                - required
          -
            handle: hero_image
            field:
              max_files: 1
              container: assets
              type: assets
              display: 'Header afbeelding'
              width: 50
          -
            handle: header_title
            field:
              type: text
              display: 'Header titel'
              width: 50
              validate:
                - required
          -
            handle: header_tekst
            field:
              remove_empty_nodes: false
              type: bard
              display: 'Header tekst'
              width: 50
          -
            handle: contact_button
            field:
              type: text
              display: 'Primaire knoptekst'
              default: 'Boek nu'
              width: 50
          -
            handle: contact_button_link
            field:
              collections:
                - pages
              type: link
              display: 'Primaire knoplink'
              width: 50
          -
            handle: about_us_button
            field:
              type: text
              display: 'Secundaire knoptekst'
              default: 'Over ons'
              width: 50
          -
            handle: about_us_button_link
            field:
              collections:
                - pages
              type: link
              display: 'Secundaire knoplink'
              width: 50

      -
        display: 'Over ons sectie'
        fields:
          -
            handle: over_ons_home
            field:
              type: text
              display: 'Kleine bovenregel'
          -
            handle: over_ons_home_titel
            field:
              type: text
              display: 'Over ons titel'
          -
            handle: over_ons_text_home
            field:
              remove_empty_nodes: false
              type: bard
              display: 'Over ons tekst'

          -
        display: Diensten
        fields:
          -
            handle: diensten_titel
            field:
              type: text
              display: 'Diensten titel'
              default: Diensten
          -
            handle: diensten
            field:
              type: replicator
              display: Diensten
              collapse: false
              sets:
                diensten:
                  display: Diensten
                  sets:
                    dienst:
                      display: Dienst
                      fields:
                        -
                          handle: dienst_titel
                          field:
                            type: text
                            display: Titel
                            validate:
                              - required
                        -
                          handle: dienst_afbeelding
                          field:
                            type: assets
                            display: Afbeelding
                            container: assets
                            max_files: 1
                        -
                          handle: dienst_beschrijving
                          field:
                            type: textarea
                            display: Beschrijving
                        -
                          handle: dienst_link
                          field:
                            type: link
                            display: Link
                        -
                          handle: dienst_linktekst
                          field:
                            type: text
                            display: Linktekst
                            default: 'Meer informatie'

      -
        display: 'Wat mensen ervan vonden'
        fields:
          -
            handle: testimonials_titel
            field:
              type: text
              display: Sectietitel
              default: 'Wat mensen ervan vonden'
          -
            handle: testimonials
            field:
              type: replicator
              display: Testimonials
              collapse: false
              sets:
                testimonials:
                  display: Testimonials
                  sets:
                    testimonial:
                      display: Testimonial
                      fields:
                        -
                          handle: testimonial_tekst
                          field:
                            type: textarea
                            display: Tekst
                            validate:
                              - required
                        -
                          handle: testimonial_naam
                          field:
                            type: text
                            display: Naam
                        -
                          handle: testimonial_functie
                          field:
                            type: text
                            display: Functie
                        -
                          handle: testimonial_afbeelding
                          field:
                            type: assets
                            display: Afbeelding
                            container: assets
                            max_files: 1

      -
        display: 'CTA sectie'
        fields:
          -
            handle: cta_titel
            field:
              type: text
              display: Titel
              default: 'Geïnteresseerd in wat paardencoaching kan doen?'
          -
            handle: cta_tekst
            field:
              type: textarea
              display: Tekst
          -
            handle: cta_knop_tekst
            field:
              type: text
              display: Knoptekst
              default: 'Neem contact op'
              width: 50
          -
            handle: cta_knop_link
            field:
              collections:
                - pages
              type: link
              display: Knoplink
              width: 50

  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: parent
            field:
              type: entries
              collections:
                - pages
              max_items: 1
              listable: false
              localizable: true