title: page_homepage
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              width: 50
              validate:
                - required
          -
            handle: hero_image
            field:
              max_files: 1
              container: assets
              type: assets
              display: 'Header afbeelding'
              width: 50
          -
            handle: header_title
            field:
              type: text
              display: 'Header titel'
              width: 50
          -
            handle: spacing
            field:
              type: width
              display: Spacing
              width: 50
          -
            handle: header_tekst
            field:
              remove_empty_nodes: false
              type: bard
              display: 'Header tekst'
              width: 50
          -
            handle: spacing_duplicate
            field:
              type: width
              display: 'Spacing (Duplicate)'
              width: 50
      -
        display: 'Over ons sectie'
        fields:
          -
            handle: over_ons_home
            field:
              type: text
              display: 'Over ons home'
          -
            handle: over_ons_home_titel
            field:
              type: text
              display: 'Over ons home titel'
          -
            handle: over_ons_text_home
            field:
              remove_empty_nodes: false
              type: bard
              display: 'Over ons text home'
      -
        display: Diensten
        fields:
          -
            handle: titel_dienst
            field:
              type: text
              display: 'Titel Dienst'
              width: 33
          -
            handle: titel_dienst_2
            field:
              type: text
              display: 'Titel Dienst 2'
              width: 33
          -
            handle: titel_dienst_3
            field:
              type: text
              display: 'Titel Dienst 3'
              width: 33
          -
            handle: assets_field_1
            field:
              container: assets
              type: assets
              display: 'Assets Field 1'
              width: 33
          -
            handle: assets_field_2
            field:
              container: assets
              type: assets
              display: 'Assets Field 2'
              width: 33
          -
            handle: assets_field_3
            field:
              container: assets
              type: assets
              display: 'Assets Field 3'
              width: 33
          -
            handle: dienst_uitleg_1
            field:
              type: text
              display: 'Dienst uitleg 1'
              width: 33
          -
            handle: dienst_uitleg_2
            field:
              type: text
              display: 'Dienst uitleg 2'
              width: 33
          -
            handle: dienst_uitleg_3
            field:
              type: text
              display: 'Dienst uitleg 3'
              width: 33
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: parent
            field:
              type: entries
              collections:
                - pages
              max_items: 1
              listable: false
              localizable: true
