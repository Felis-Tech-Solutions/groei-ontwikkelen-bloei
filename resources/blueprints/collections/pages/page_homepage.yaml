title: page_homepage
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              width: 50
              validate:
                - required
          -
            handle: hero_image
            field:
              max_files: 1
              container: assets
              type: assets
              display: 'Header afbeelding'
              width: 50
          -
            handle: header_title
            field:
              type: text
              display: 'Header titel'
              width: 50
          -
            handle: spacing
            field:
              type: width
              display: Spacing
              width: 50
          -
            handle: header_tekst
            field:
              remove_empty_nodes: false
              type: bard
              display: 'Header tekst'
              width: 50
          -
            handle: spacing_duplicate
            field:
              type: width
              display: 'Spacing (Duplicate)'
              width: 50
          -
            handle: contact_button
            field:
              default: 'Boek nu'
              type: button_group
              display: 'Contact button'
              width: 50
          -
            handle: about_us_button
            field:
              default: 'Over ons'
              type: button_group
              display: 'Over ons'
              width: 50
          -
            handle: link_pagina
            field:
              collections:
                - pages
              type: link
              display: 'link pagina'
      -
        display: 'Over ons sectie'
        fields:
          -
            handle: over_ons_home
            field:
              type: text
              display: 'Over ons home'
          -
            handle: over_ons_home_titel
            field:
              type: text
              display: 'Over ons home titel'
          -
            handle: over_ons_text_home
            field:
              remove_empty_nodes: false
              type: bard
              display: 'Over ons text home'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: parent
            field:
              type: entries
              collections:
                - pages
              max_items: 1
              listable: false
              localizable: true
