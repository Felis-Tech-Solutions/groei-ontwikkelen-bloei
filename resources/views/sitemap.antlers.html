<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
{{ collection from="pages|services" }}
  {{ unless seo_noindex }}
  <url>
    <loc>{{ permalink }}</loc>
    <lastmod>{{ last_modified format="Y-m-d" }}</lastmod>
  </url>
  {{ /unless }}
{{ /collection }}
</urlset>
