<!doctype html>
<html lang="{{ site:short_locale }}">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{{ title ?? site:name }}</title>
        {{ vite src="resources/js/site.js|resources/css/site.css" }}
    </head>
    <body class="bg-gob-bg font-sans leading-normal text-gray-800">
        {{ partial:navigation }}
        {{ template_content }}
        {{ partial:footer }}
    </body>
    <div id="site-notice" style="
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(0,0,0,.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
">
    <div style="
        background: white;
        color: #32281E;
        max-width: 520px;
        width: 100%;
        padding: 32px;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0,0,0,.25);
        text-align: center;
        font-family: sans-serif;
    ">
        <h2 style="margin: 0 0 12px; font-size: 28px;">
            Website in ontwikkeling
        </h2>

        <p style="margin: 0 0 24px; font-size: 18px; line-height: 1.5;">
            We werken op dit moment aan de website. Hierdoor kan sommige informatie tijdelijk ontbreken of wijzigen.
        </p>

        <button onclick="document.getElementById('site-notice').style.display='none'" style="
            background: #59A4B7;
            color: white;
            border: 0;
            padding: 12px 24px;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 700;
            font-size: 16px;
        ">
            Ik begrijp het
        </button>
    </div>
</div>
</html>
